name: Validate news bot

on:
  push:
    branches:
      - "improve/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python syntax
        run: python -m py_compile bot.py tests/test_bot_quality.py
      - name: Run offline unit tests
        env:
          TELEGRAM_BOT_TOKEN: "test-token-for-local-unit-tests"
        run: python -m unittest discover -s tests -v
