name: Nha Trang News Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      run_bot:
        description: 'Run the production bot on main (requires private storage and secrets)'
        required: true
        type: boolean
        default: false
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nhatrang-life-news-bot
  cancel-in-progress: false

jobs:
  test:
    name: Compile and unit tests (no Telegram publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TEST_MODE: '1'
      TELEGRAM_BOT_TOKEN: 'test-token-for-local-unit-tests'
      ADMIN_USER_IDS: '1335496436,8563451956'
      WEATHERAPI_KEY: 'test-only-weather-key'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile bot.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  run-bot:
    name: Scheduled production run
    needs: test
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_bot == true && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
      ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
      MAX_DAILY_POSTS: '6'
      MAX_DAILY_NEWS: '3'
      MAX_AI_CALLS_PER_DAY: '40'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile production code
        run: python -m py_compile bot.py
      - name: Run news and weather pipeline
        run: python bot.py
