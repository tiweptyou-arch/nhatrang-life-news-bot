name: Nha Trang News Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nhatrang-life-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          ADMIN_USER_IDS: "1335496436,8563451956"
        run: python bot.py

      - name: Save bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_state.json
          if git diff --cached --quiet; then
            echo "Bot state has not changed."
            exit 0
          fi
          git commit -m "Update bot state"

          # Retry non-fast-forward/network failures. If bot_state.json conflicts with
          # a concurrent manual change, fail rather than replacing someone else's data.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Bot state saved."
              exit 0
            fi
            echo "Push attempt $attempt failed; fetching latest main and retrying."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Could not safely rebase bot state. No conflicting state was overwritten."
              exit 1
            fi
          done

          echo "::error::Could not save bot state after 3 attempts."
          exit 1
