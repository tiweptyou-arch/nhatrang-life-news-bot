name: Nha Trang News Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      run_bot:
        description: 'Run the production bot on main (requires private storage and secrets)'
        required: true
        type: boolean
        default: false
      preview_weather_now:
        description: 'Send one weather test draft privately to the editor (main only)'
        required: true
        type: boolean
        default: false
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nhatrang-life-news-bot
  cancel-in-progress: false

jobs:
  test:
    name: Compile and unit tests (no Telegram publishing)
    if: ${{ github.event_name != 'schedule' || vars.RUN_ON_MAC != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TEST_MODE: '1'
      TELEGRAM_BOT_TOKEN: 'test-token-for-local-unit-tests'
      ADMIN_USER_IDS: '111111111,222222222'
      WEATHERAPI_KEY: 'test-only-weather-key'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image card processing
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile bot.py imagegen.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  run-bot:
    name: Scheduled production run
    needs: test
    if: ${{ (github.event_name == 'schedule' && vars.RUN_ON_MAC != 'true') || (github.event_name == 'workflow_dispatch' && (inputs.run_bot == true || inputs.preview_weather_now == true) && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
      ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_TEXT_MODEL: 'gpt-6-luna'
      OPENAI_DAILY_BUDGET_USD: '0.75'
      OPENAI_MONTHLY_BUDGET_USD: '8.0'
      MAX_SINGLE_IMAGE_RESERVE_USD: '0.15'
      MAX_AI_CALLS_PER_DAY: '40'
      AUTO_PUBLISH: 'true'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IMAGE_PROVIDER: 'openai'
      OPENAI_IMAGE_MODEL: 'gpt-image-2.5-flare'
      OPENAI_IMAGE_QUALITY: 'low'
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
      MAX_DAILY_POSTS: '10'
      MAX_DAILY_NEWS: '4'
      MAX_DAILY_ADS: '1'
      MAX_IMAGE_GENERATIONS_PER_DAY: '8'
      MAX_IMAGE_SPEND_USD_PER_DAY: '0.25'
      MAX_IMAGE_SPEND_USD_PER_MONTH: '7.0'
      # Channel writes are limited to the explicit GREEN-news pathway when AUTO_PUBLISH is enabled.
      NEWS_SOURCES_FILE: 'sources.json'
      # Legacy direct publication remains disabled; AUTO_PUBLISH has its own GREEN-only guard.
      AUTO_PUBLISH_DIRECT: 'false'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install weather card image processing
        run: python -m pip install -r requirements.txt
      - name: Compile production code
        run: python -m py_compile bot.py
      - name: Prepare one private weather test draft
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_weather_now == true }}
        run: python bot.py --preview-weather-now
      - name: Run news and weather pipeline
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_bot == true && inputs.preview_weather_now != true) }}
        run: python bot.py
